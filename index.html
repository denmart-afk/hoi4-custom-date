<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOI4 — дата старта</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:16px;line-height:1.4}
input,select,button{font:inherit;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{width:auto;padding:4px 10px;border-radius:14px;cursor:pointer}
#w{min-height:2.6em;opacity:.8}
code{word-break:break-all}
</style></head><body>
<h1>🗓 Дата старта HOI4</h1>
<label>Дата<input type="date" id="d" value="1939-09-01" min="0100-01-01" max="2100-12-31"></label>
<div class="chips" id="chips"></div>
<label>Страна по умолчанию<select id="c"></select></label>
<p id="w"></p>
<button id="b">⬇ Скачать мод (.zip)</button>
<p>Распакуй содержимое архива прямо в <code>Documents\Paradox Interactive\Hearts of Iron IV\mod</code> (с заменой), включи «Custom Start Date» в лаунчере, в игре выбери сценарий «Свободная дата».</p>
<script>
const pad = n => String(n).padStart(2, '0');

const COUNTRIES = {
  GER: ['Germany', 'Германия', 'fascism'],
  SOV: ['Soviet Union', 'СССР', 'communism'],
  USA: ['United States', 'США', 'democratic'],
  ENG: ['United Kingdom', 'Великобритания', 'democratic'],
  FRA: ['France', 'Франция', 'democratic'],
  ITA: ['Italy', 'Италия', 'fascism'],
  JAP: ['Japan', 'Япония', 'fascism']
};

function buildFiles({ y, m, d, country = 'GER' }) {
  const human = `${pad(d)}.${pad(m)}.${y}`;
  const date = `${y}.${m}.${d}.12`;
  const head = 'version="1.0.0"\ntags={\n\t"Gameplay"\n\t"Utilities"\n}\nname="Custom Start Date"\nsupported_version="1.19.*"\n';

  const entries = Object.entries(COUNTRIES).map(([t, c]) =>
    `\t\t"${t}" = {\n\t\t\thistory = "CUSTOM_DATE_${t}_DESC"\n\t\t\tideology = ${c[2]}\n\t\t\tideas = { }\n\t\t\tfocuses = { }\n\t\t}`
  ).join('\n');
  const bookmark =
`bookmarks = {
	bookmark = {
		name = "CUSTOM_DATE_NAME"
		desc = "CUSTOM_DATE_DESC"
		date = ${date}
		picture = "GFX_select_date_1936"
		default_country = "${country}"

${entries}

		effect = {
			randomize_weather = 22345 # obligatory in every bookmark
		}
	}
}
`;

  const endY = Math.max(1960, y + 14);
  let defines = `-- Extends the game timeline so late start dates do not end instantly\nNDefines.NGame.END_DATE = "${endY}.1.1.12"\n`;
  if (y < 1936) defines += `NDefines.NGame.START_DATE = "${date}"\n`;

  const loc = (lang, name, desc, fn) =>
    '\ufeff' + `l_${lang}:\n CUSTOM_DATE_NAME:0 "${name}"\n CUSTOM_DATE_DESC:0 "${desc}"\n` +
    Object.entries(COUNTRIES).map(([t, c]) => ` CUSTOM_DATE_${t}_DESC:0 "${fn(c)}"`).join('\n') + '\n';

  const en = loc('english', `Custom Date: ${human}`,
    `Start on ${human}. The world uses the latest vanilla history snapshot before this date.`,
    c => `Play as ${c[0]} starting ${human}.`);
  const ru = loc('russian', `Свободная дата: ${human}`,
    `Старт ${human}. Мир берётся из последнего ванильного исторического среза до этой даты.`,
    c => `Играть за страну «${c[1]}» с ${human}.`);

  return [
    ['custom_date.mod', head + 'path="mod/custom_date"\n'],
    ['custom_date/descriptor.mod', head],
    ['custom_date/common/bookmarks/custom_date.txt', bookmark],
    ['custom_date/common/defines/custom_date.lua', defines],
    ['custom_date/localisation/english/custom_date_l_english.yml', en],
    ['custom_date/localisation/russian/custom_date_l_russian.yml', ru]
  ];
}

function makeZip(files) {
  const enc = new TextEncoder();
  const crcT = [];
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT[n] = c >>> 0; }
  const crc = b => { let c = 0xFFFFFFFF; for (const x of b) c = crcT[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const local = [], central = [];
  let off = 0;
  for (const [name, text] of files) {
    const nb = enc.encode(name), db = enc.encode(text), c = crc(db);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(12, 0x21, true); h.setUint32(14, c, true); h.setUint32(18, db.length, true);
    h.setUint32(22, db.length, true); h.setUint16(26, nb.length, true);
    local.push(new Uint8Array(h.buffer), nb, db);
    const g = new DataView(new ArrayBuffer(46));
    g.setUint32(0, 0x02014b50, true); g.setUint16(4, 20, true); g.setUint16(6, 20, true); g.setUint16(8, 0x0800, true);
    g.setUint16(14, 0x21, true); g.setUint32(16, c, true); g.setUint32(20, db.length, true);
    g.setUint32(24, db.length, true); g.setUint16(28, nb.length, true); g.setUint32(42, off, true);
    central.push(new Uint8Array(g.buffer), nb);
    off += 30 + nb.length + db.length;
  }
  const cdSize = central.reduce((a, x) => a + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  const parts = [...local, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(parts.reduce((a, x) => a + x.length, 0));
  let p = 0;
  for (const x of parts) { out.set(x, p); p += x.length; }
  return out;
}

const $ = id => document.getElementById(id);
const KEY = [['1936-01-01','Старт 1936'],['1938-03-12','Аншлюс'],['1939-09-01','Польша'],['1940-05-10','Франция'],['1941-06-22','Барбаросса'],['1941-12-07','Перл-Харбор'],['1944-06-06','День D']];
for (const [v, t] of KEY) { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { $('d').value = v; check(); }; $('chips').append(b); }
for (const [t, c] of Object.entries(COUNTRIES)) $('c').add(new Option(c[1], t));
function check() {
  const v = $('d').value;
  $('w').textContent = !v ? 'Выбери дату.' : v < '1936-01-01'
    ? '⚠ Раньше 1936 у стран нет стартовых данных — возможны ошибки.'
    : 'Мир берётся из последнего ванильного среза до этой даты.';
}
$('d').oninput = check; check();
$('b').onclick = () => {
  const v = $('d').value; if (!v) return;
  const [y, m, d] = v.split('-').map(Number);
  const blob = new Blob([makeZip(buildFiles({ y, m, d, country: $('c').value }))], { type: 'application/zip' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'custom_date_' + v + '.zip'; a.click();
};
</script></body></html>
